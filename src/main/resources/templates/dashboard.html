<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker - Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Expense Tracker</a>
        <div class="d-flex ms-auto">
            <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                Hello, <strong th:text="${firstName}">User</strong>
            </span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-3">Dashboard</h1>
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Group Name</th>
        <th>Owner</th>
        <th>Members</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="group : ${groups}">
        <td th:text="${group.name}">Group Name</td>
        <td th:text="${group.owner.email}">Owner</td>
        <td th:text="${#lists.size(group.members)}">0</td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(groups)}" class="alert alert-info">
    No groups found for your user.
</div>

<h2>Create New Group</h2>

<form th:action="@{/groups}" th:object="${createGroupForm}" method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Group Name</label>
        <input type="text"
               id="name"
               th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"
               th:field="*{name}"
               placeholder="Eg: Main House" />
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Validation Error</div>
    </div>
    <button type="submit" class="btn btn-primary">Create Group</button>
</form>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
